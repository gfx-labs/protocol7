name: ci

# Build, vet and test every pull request and every commit on master. The
# selfdev reviewer waits for this before it merges.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  temporal:
    runs-on: talos-metal-gfx-public
    defaults:
      run:
        working-directory: temporal
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: temporal/go.mod
          cache-dependency-path: temporal/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  go:
    runs-on: talos-metal-gfx-public
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The end-to-end tests in pkg/p7 start a Temporal dev server through the
      # temporal CLI and skip without it.
      - name: temporal CLI
        env:
          TEMPORAL_VERSION: 1.9.1
        run: |
          curl -fsSL -o temporal.tgz "https://github.com/temporalio/cli/releases/download/v${TEMPORAL_VERSION}/temporal_cli_${TEMPORAL_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf temporal.tgz -C "$RUNNER_TEMP/bin" temporal
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: tests
        run: |
          go test -json -race ./... > test.json || rc=$?
          jq -j 'select(.Action == "output") | .Output' test.json
          exit "${rc:-0}"

  # navi's API schemas: lint, no breaking change against the base, and the
  # committed generated code matches proto/. The plugins are pinned locally
  # (go.mod's tool block, web/naviapi/package-lock.json), so buf fetches
  # nothing from the Buf Schema Registry.
  proto:
    runs-on: talos-metal-gfx-public
    env:
      BUF_VERSION: 1.73.0
      BUF_SHA256: f8092c1be08d5606a8d22b4ae0e4079dd690154cebb4894dc5e24a5046093aff
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: buf
        run: |
          curl -fsSL -o buf.tgz "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64.tar.gz"
          echo "${BUF_SHA256}  buf.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/buf"
          tar -xzf buf.tgz -C "$RUNNER_TEMP/buf" --strip-components 1
          rm buf.tgz
          echo "$RUNNER_TEMP/buf/bin" >> "$GITHUB_PATH"
      - name: protoc-gen-es
        working-directory: web/naviapi
        run: npm ci --no-audit --no-fund
      - run: buf lint
      # A pull request is checked against its base, a push to master against
      # the commit before it. A base with no schemas has nothing to break.
      - name: buf breaking
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE:proto" 2>/dev/null; then
            echo "the base $BASE has no proto directory, nothing to compare"
            exit 0
          fi
          buf breaking --against ".git#ref=$BASE"
      - name: buf generate
        run: |
          buf generate
          git status --porcelain -- pkg/transport/naviapi web/naviapi/src
          test -z "$(git status --porcelain -- pkg/transport/naviapi web/naviapi/src)"

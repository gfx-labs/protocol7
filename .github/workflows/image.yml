name: image

# Builds ghcr.io/gfx-labs/protocol7:<commit> and pushes it with this
# workflow's own token. No other credential can write the package.

on:
  push:
    branches: [master]
    paths:
      - cmd/**
      - pkg/**
      - go.mod
      - go.sum
      - containers/p7/**
      - containers/temporal/**
      - temporal/**
      - scripts/build-image
      - .dockerignore
  workflow_dispatch:

jobs:
  image:
    if: github.ref == 'refs/heads/master'
    runs-on: talos-metal-gfx-public
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: scripts/build-image --push

  temporal:
    if: github.ref == 'refs/heads/master'
    runs-on: talos-metal-gfx-public
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build SPIFFE Temporal server
        run: |
          image="ghcr.io/gfx-labs/protocol7/p7-temporal:$(git rev-parse --short=12 HEAD)"
          docker buildx build --platform linux/amd64 \
            -f containers/temporal/Dockerfile -t "$image" \
            --cache-from type=registry,ref=ghcr.io/gfx-labs/protocol7/p7-temporal:buildcache \
            --cache-to type=registry,ref=ghcr.io/gfx-labs/protocol7/p7-temporal:buildcache,mode=max \
            --metadata-file temporal-image.json --push .
          digest=$(jq -r '.["containerimage.digest"]' temporal-image.json)
          echo "$image@$digest" >> "$GITHUB_STEP_SUMMARY"
